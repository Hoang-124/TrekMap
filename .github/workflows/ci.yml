name: LOST CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  server-verify:
    name: Server Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run Server automated tests
        run: npm test

  client-verify:
    name: Client Build, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: TypeScript & Vite production build
        run: npm run build

      - name: Run ESLint verification (zero warnings)
        run: npm run lint -- --max-warnings=0

      - name: Verify Service Worker syntax
        run: node --check public/sw.js

      - name: Run Client automated tests
        run: npm test
