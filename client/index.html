  <script>
    (function () {
      var root = document.documentElement;
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
          root.setAttribute('data-theme', savedTheme);
        } else {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }
      } catch (_err) {
        root.setAttribute('data-theme', 'dark');
      }
      try {
        var nav = navigator || {};
        var conn = nav.connection || {};
        var lowMem = typeof nav.deviceMemory === 'number' && nav.deviceMemory > 0 && nav.deviceMemory <= 4;
        var lowCpu = typeof nav.hardwareConcurrency === 'number' && nav.hardwareConcurrency > 0 && nav.hardwareConcurrency <= 4;
        var slowNet = conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g' || conn.effectiveType === '3g';
        root.setAttribute('data-perf', lowMem || lowCpu || conn.saveData || slowNet ? 'lite' : 'full');
      } catch (_perfErr) {
        root.setAttribute('data-perf', 'full');
      }
    })();
  </script>
