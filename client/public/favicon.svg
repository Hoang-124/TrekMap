<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ed7b5" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#071319" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Icon Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Mountain Peaks & Compass Needle -->
  <g fill="none" stroke="#041217" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mountain Peak Silhouette -->
    <path d="M14 44 L28 20 L38 34 L48 18 L50 44 Z" fill="#041217" opacity="0.9" />
    <!-- Compass North Star Indicator -->
    <circle cx="32" cy="32" r="16" stroke="#ffffff" stroke-width="2.5" />
    <polygon points="32,20 36,32 32,44 28,32" fill="#ffffff" stroke="none" />
    <polygon points="32,20 36,32 32,32" fill="#0ed7b5" stroke="none" />
  </g>
</svg>