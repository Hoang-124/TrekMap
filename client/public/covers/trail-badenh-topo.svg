  <path d="M 160.0 465.0 L 204.0 427.8 L 292.0 390.7 L 380.0 351.5 L 490.0 310.2 L 556.0 275.1 L 622.0 242.0 L 688.0 209.0 L 754.0 176.0 L 820.0 145.0" fill="none" stroke="#d4a348" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
