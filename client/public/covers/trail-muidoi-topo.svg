<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Bản đồ địa hình Trekking Cực Đông Mũi Đôi - Bán Đảo Hòn Gốm (Khánh Hòa)">
