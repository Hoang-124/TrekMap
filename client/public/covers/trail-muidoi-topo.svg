    <text x="1144" y="68" text-anchor="end" fill="#b7c7be" font-size="12" font-weight="700" letter-spacing="1.4">12.6353°N 109.3781°E  →  12.6478°N 109.4622°E</text>
    <text x="108" y="544" fill="#b7c7be" font-size="11" font-weight="700" letter-spacing="2">MẶT CẮT ĐỘ CAO THỰC ĐỊA (8M → 75M)</text>
