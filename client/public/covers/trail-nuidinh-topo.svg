  <circle cx="1040.0" cy="145.0" r="9" fill="#f7dfb0" stroke="#0b1310" stroke-width="2.5"/>
  <circle cx="1040.0" cy="145.0" r="18" fill="none" stroke="#f7dfb0" stroke-opacity="0.55" stroke-width="1.3"/>

  <!-- Elevation Profile Strip -->
  <rect x="76" y="520" width="1048" height="175" rx="6" fill="#09100d" fill-opacity="0.72" stroke="#d4a348" stroke-opacity="0.28" stroke-width="1"/>
  <path d="M 110.0 660.0 L 600.0 608.4 L 1090.0 550.0 L 1090.0 670 L 110.0 670 Z" fill="url(#epFill)"/>
  <path d="M 110.0 660.0 L 600.0 608.4 L 1090.0 550.0" fill="none" stroke="#d4a348" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Header Cartographic Bar -->
