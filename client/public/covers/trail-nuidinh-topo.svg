  <!-- Topographic Contours -->
  <g><ellipse cx="621.0" cy="304.5" rx="88" ry="44" transform="rotate(12 621.0 304.5)" fill="none" stroke="#d4a348" stroke-opacity="0.20" stroke-width="0.8"/><ellipse cx="621.0" cy="304.5" rx="166" ry="86" transform="rotate(12 621.0 304.5)" fill="none" stroke="#d4a348" stroke-opacity="0.18" stroke-width="0.8"/><ellipse cx="621.0" cy="304.5" rx="244" ry="128" transform="rotate(12 621.0 304.5)" fill="none" stroke="#d4a348" stroke-opacity="0.16" stroke-width="1.4"/><ellipse cx="621.0" cy="304.5" rx="322" ry="170" transform="rotate(12 621.0 304.5)" fill="none" stroke="#d4a348" stroke-opacity="0.14" stroke-width="0.8"/><ellipse cx="621.0" cy="304.5" rx="400" ry="212" transform="rotate(12 621.0 304.5)" fill="none" stroke="#d4a348" stroke-opacity="0.12" stroke-width="0.8"/><ellipse cx="621.0" cy="304.5" rx="478" ry="254" transform="rotate(12 621.0 304.5)" fill="none" stroke="#d4a348" stroke-opacity="0.10" stroke-width="1.4"/><ellipse cx="621.0" cy="304.5" rx="556" ry="296" transform="rotate(12 621.0 304.5)" fill="none" stroke="#d4a348" stroke-opacity="0.08" stroke-width="0.8"/><ellipse cx="621.0" cy="304.5" rx="634" ry="338" transform="rotate(12 621.0 304.5)" fill="none" stroke="#d4a348" stroke-opacity="0.06" stroke-width="0.8"/></g>

  <!-- Real Normalized GPX Track -->
  <path d="M 160.0 465.0 L 265.1 432.6 L 370.1 396.7 L 475.2 358.9 L 586.9 321.2 L 685.4 285.2 L 783.9 249.3 L 882.4 213.3 L 961.2 177.4 L 1040.0 145.0" fill="none" stroke="#d4a348" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 160.0 465.0 L 265.1 432.6 L 370.1 396.7 L 475.2 358.9 L 586.9 321.2 L 685.4 285.2 L 783.9 249.3 L 882.4 213.3 L 961.2 177.4 L 1040.0 145.0" fill="none" stroke="#d4a348" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

