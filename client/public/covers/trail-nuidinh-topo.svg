  <g font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif">
    <text x="56" y="68" fill="#d4a348" font-size="12" font-weight="800" letter-spacing="3">LOST VIETNAM · TOPOGRAPHIC GPX SHEET</text>
    <text x="56" y="102" fill="#f4f3ee" font-size="28" font-weight="800">Núi Dinh &amp; Khám Phá Suối Tiên Vũng…</text>
    <text x="56" y="128" fill="#b7c7be" font-size="13" font-weight="600" letter-spacing="1">Bà Rịa - Vũng Tàu · 10.0 KM · +450M GAIN · ĐỈNH 504M</text>
    <text x="1144" y="68" text-anchor="end" fill="#b7c7be" font-size="12" font-weight="700" letter-spacing="1.4">10.5210°N 107.1160°E  →  10.5388°N 107.1294°E</text>
    <text x="108" y="544" fill="#b7c7be" font-size="11" font-weight="700" letter-spacing="2">MẶT CẮT ĐỘ CAO THỰC ĐỊA (35M → 504M)</text>
  </g>
