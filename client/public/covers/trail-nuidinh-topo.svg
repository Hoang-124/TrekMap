<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Bản đồ địa hình Trekking Núi Dinh &amp; Khám Phá Suối Tiên Vũng Tàu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1310"/>
      <stop offset="100%" stop-color="#13211c"/>
    </linearGradient>
    <linearGradient id="epFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a348" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#d4a348" stop-opacity="0.02"/>
