<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Bản đồ địa hình Chinh Phục Đỉnh Pù Luông 1700m - Khu BTTN Pù Luông">
